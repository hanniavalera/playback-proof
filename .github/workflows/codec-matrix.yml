name: codec-matrix

# Probes what Playwright's browsers can really decode through MediaSource on the GitHub runners and uploads the result.
# The committed matrix (docs/CODEC_MATRIX.md) is generated from these files; the end-to-end suites read it to decide which
# stream flavour an engine plays and which engine/OS pairs are documented gaps. Run it when a runner image or the
# Playwright version changes. See docs/decisions/codecs.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/lab/probe/**
      - tools/codec-matrix.ts
      - .github/workflows/codec-matrix.yml

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (makes the probe media)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            brew install ffmpeg
          fi
      - run: npm ci
      - name: Install the browsers
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install chromium firefox webkit
          fi
      - name: Probe
        run: npm run codec-matrix -- --browsers chromium,firefox,webkit --attempts 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codec-matrix-${{ matrix.os }}
          path: docs/results/codec-matrix/gha-*.json
          if-no-files-found: error
