name: nightly

# The release tier of the browser tests: every @merge and @release test, in every engine of the merge gate's matrix, every night on
# main and on demand. Nobody waits for it, so a job has the release budget (15 minutes, TEST_STRATEGY.md section 6.3) and not the
# 8 minutes of a merge job. The streams come from the same workflow as the merge gate's, with the same cache.
#
# The jobs of later phases plug in here as jobs that `need: streams`, and download the same artifact with ./.github/actions/setup:
# the soak and the readiness checks (tests/live, `npm run soak` and `npm run readiness`), the A/B runs and the performance runs.
# They do not exist yet, so they are not here.
#
# The flake gate (`flake`, `flake-record`) closes the workflow, as it closes ci.yml: the runs of the release tier are judged against
# the history and, on main, recorded in it.

on:
  schedule:
    # 04:41 UTC, off-peak. Not on the hour: that is when most scheduled workflows start and runs are delayed the most.
    - cron: '41 4 * * *'
  workflow_dispatch:
  # A schedule and a manual run only exist for a file on the default branch, so a change to this one would be seen to work (or
  # not) the night after it merges. A pull request that changes the file runs it once, before the merge.
  pull_request:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

# As in ci.yml: a pull request run is superseded by the next push, every other run keeps its own.
concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  streams:
    name: streams
    uses: ./.github/workflows/streams.yml

  # The same legs as the merge gate (ci.yml), and a unit test keeps them equal. webkit-linux is experimental (ADR-113).
  release:
    name: release (${{ matrix.leg }}${{ matrix.experimental && ', experimental' || '' }})
    needs: streams
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `limit`: the most time in milliseconds that the test run itself may take, the job's timeout less four minutes (see ci.yml).
      matrix:
        include:
          - leg: chromium
            project: chromium
            browser: chromium
            runner: ubuntu-24.04
            timeout: 30
            limit: 1560000
          - leg: firefox
            project: firefox
            browser: firefox
            runner: ubuntu-24.04
            timeout: 30
            limit: 1560000
          - leg: chromium-cpu4x
            project: chromium-cpu4x
            browser: chromium
            runner: ubuntu-24.04
            timeout: 30
            limit: 1560000
          - leg: webkit-linux
            experimental: true
            project: webkit
            browser: webkit
            runner: ubuntu-24.04
            timeout: 30
            limit: 1560000
          # One worker on the three-CPU macOS runner, as in the merge gate (ci.yml).
          - leg: webkit-macos
            project: webkit
            browser: webkit
            runner: macos-15
            workers: 1
            timeout: 45
            limit: 2460000
    env:
      CI: 'true'
      PB_WORKERS: ${{ matrix.workers || 2 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node, the streams and the browser
        id: setup
        uses: ./.github/actions/setup
        with:
          streams: 'true'
          browser: ${{ matrix.browser }}
      - name: Build the player
        run: npm run build:player
      # No npm script runs both tiers (`test:merge` and `test:release` select one tag each, and two runs would overwrite each
      # other's report), so one run selects both tags.
      - name: '@merge and @release tests (${{ matrix.project }})'
        run: npm run test:e2e -- --grep "@merge|@release" --grep-invert "@readiness" --project=${{ matrix.project }} --global-timeout=${{ matrix.limit }}
      - name: Summarise the run
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: npx tsx tools/ci-summary.ts --title "${{ github.job }} (${{ matrix.leg }})" --artifact reports-${{ matrix.leg }}
      - name: Upload the reports and the failure attachments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.leg }}
          path: |
            reports
            test-results
          retention-days: 30
          overwrite: true

  # The flake gate of the nightly (docs/CI.md, ADR-170 to ADR-172): the two jobs of ci.yml for the runs of this workflow, so that the
  # history also holds the flake rates of the @release tests (the runs here contain the @merge tests as well, which count as builds
  # of their engine job like the merge gate's do). The names say `nightly`: the required check `flake` is the one of ci.yml, and two
  # checks of one name would make a pull request ambiguous. The judge also runs on the pull request that changes this file, which
  # is the only time its wiring is exercised before the merge; the recorder never does.
  flake:
    name: flake (nightly)
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FLAKE_IDENTITY: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the run files of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports/flake
      - name: Judge the Linux legs (gha-linux-x64)
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY"
          --runs reports/flake/reports-chromium --runs reports/flake/reports-firefox
          --runs reports/flake/reports-chromium-cpu4x --runs reports/flake/reports-webkit-linux
          --json reports/flake/gate-linux.json
      - name: Judge the macOS leg (gha-macos-arm64)
        if: ${{ !cancelled() }}
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY"
          --runs reports/flake/reports-webkit-macos --json reports/flake/gate-macos.json

  # Records the nightly in the history, for the schedule and for a manual run on main: the code it runs is main's, never a pull
  # request's. The only job of this workflow with a write token; see the same job in ci.yml for how it records and what it tolerates.
  flake-record:
    name: flake-record (nightly)
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FLAKE_IDENTITY: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the run files of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports/flake
      - name: Record the Linux legs (gha-linux-x64)
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY" --record --push
          --runs reports/flake/reports-chromium --runs reports/flake/reports-firefox
          --runs reports/flake/reports-chromium-cpu4x --runs reports/flake/reports-webkit-linux
          --json reports/flake/gate-linux.json || [ "$?" -eq 1 ]
      - name: Record the macOS leg (gha-macos-arm64)
        if: ${{ !cancelled() }}
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY" --record --push
          --runs reports/flake/reports-webkit-macos --json reports/flake/gate-macos.json || [ "$?" -eq 1 ]
      - name: Check that both environments are in the history
        if: ${{ !cancelled() }}
        run: jq -e -s 'all(.[]; .recorded != null)' reports/flake/gate-linux.json reports/flake/gate-macos.json

  # The triage of ci.yml for the runs of this workflow (see there): the @release tests fail here first, and a nightly nobody is
  # watching is the build whose red most needs explaining. It never decides anything and is skipped when the run is green. The name
  # says `nightly` for the reason the flake jobs' do.
  triage:
    name: triage (nightly)
    needs: [release, flake]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the reports of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: artifacts
      - name: Triage the failures
        run: npm run gate:triage -- --from artifacts --out reports/triage
      - name: Upload the triage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage
          path: reports/triage
          retention-days: 14
          overwrite: true
