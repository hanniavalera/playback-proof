name: ci

# The merge gate. Each job is one stage of the pipeline that the Jenkinsfile also runs: the stage names are the
# `npm run gate:*` scripts, so the two CI systems cannot drift apart (a unit test compares them).
# The pipeline as a diagram, the budgets and how to reproduce a job locally: docs/CI.md. The decisions: docs/decisions/ci.md.
# The performance gate is added when the baselines of the runner are recorded; see TEST_STRATEGY.md section 6.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      control_ref:
        description: The control of the perf gate, a git ref of this checkout (HEAD, the default, makes the run an A/A by construction)
        type: string
        default: HEAD

permissions:
  contents: read

# One run per pull request: a new push cancels the one in progress. Every push to main and every manual run keeps its own
# (the run id makes the group unique), because a verdict on a merged commit is never superseded.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run gate:static

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The media tests run the real ffmpeg (the version Ubuntu ships is the one the pipeline is verified against).
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      - run: npm run gate:unit

  # Generates the streams once per cache key and publishes them as the `streams` artifact; the browser jobs download it.
  streams:
    name: streams
    uses: ./.github/workflows/streams.yml

  # The @merge browser tests, one job per engine, in parallel: the stage is the npm script the Jenkinsfile calls, and only the
  # Playwright project differs. A leg that fails fails the run: nothing here is allowed to fail (no continue-on-error).
  # webkit-linux is the experimental engine (ADR-113): it is a required check like the others, and its name says what it is.
  merge-gate:
    name: merge-gate (${{ matrix.leg }}${{ matrix.experimental && ', experimental' || '' }})
    needs: streams
    runs-on: ${{ matrix.runner }}
    # The budget of one engine is 8 minutes with warm caches (TEST_STRATEGY.md section 6.3); the timeout is the net under it.
    # macOS runners are slower and have 3 CPUs, so they get more: the macOS probe job took about 25 minutes.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # `limit` is the most time, in milliseconds, that the test run itself may take: Playwright stops there and still writes its
      # report. It is the job's timeout less four minutes for the setup and the upload, because a job that the runner kills
      # leaves no report (ADR-114).
      matrix:
        include:
          - leg: chromium
            project: chromium
            browser: chromium
            runner: ubuntu-24.04
            timeout: 15
            limit: 660000
          - leg: firefox
            project: firefox
            browser: firefox
            runner: ubuntu-24.04
            timeout: 15
            limit: 660000
          - leg: chromium-cpu4x
            project: chromium-cpu4x
            browser: chromium
            runner: ubuntu-24.04
            timeout: 15
            limit: 660000
          - leg: webkit-linux
            experimental: true
            project: webkit
            browser: webkit
            runner: ubuntu-24.04
            timeout: 15
            limit: 660000
          # Three CPUs: two workers (a WebKit with its helper processes each, and the service) starved each other and the specs saw
          # event delivery lag by 0.3 to 3 s, which no tolerance measured on a faster machine can absorb (docs/CI.md).
          - leg: webkit-macos
            project: webkit
            browser: webkit
            runner: macos-15
            workers: 1
            timeout: 30
            limit: 1560000
    env:
      # GitHub sets it too. The Playwright config reads it: two workers (a leg may say otherwise), one retry, no test.only.
      CI: 'true'
      PB_WORKERS: ${{ matrix.workers || 2 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node, the streams and the browser
        id: setup
        uses: ./.github/actions/setup
        with:
          streams: 'true'
          browser: ${{ matrix.browser }}
      - name: Build the player
        run: npm run build:player
      - name: Merge gate (${{ matrix.project }})
        run: npm run gate:merge -- --project=${{ matrix.project }} --global-timeout=${{ matrix.limit }}
      # The tests that failed, flaked or were skipped, with their attachments, on the page of this job.
      - name: Summarise the run
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: npx tsx tools/ci-summary.ts --title "${{ github.job }} (${{ matrix.leg }})" --artifact reports-${{ matrix.leg }}
      # The JSON report and every failure attachment: the flake tracker and the failure triage read them.
      - name: Upload the reports and the failure attachments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.leg }}
          path: |
            reports
            test-results
          retention-days: 14
          overwrite: true

  # The performance gate (docs/PERF.md, ADR-120 to ADR-129, ADR-178 and ADR-179): the head is compared with a CONTROL, the base of the
  # change, measured on this very machine minutes earlier by the control's own harness, and never with a baseline committed from
  # another machine: GitHub-hosted runners of one label land on different CPU models, and the same code failed a committed baseline
  # on the slower ones (docs/results/perf/gha-cross-vm.md). The base is the first parent of the commit that was checked out: for a
  # pull request the merge commit's, for a push to main the previous tip; a manual run takes the input (default HEAD: an A/A, which
  # is how the false-positive rate of this job is measured). One leg per profile, in parallel. Exit 1 is a regression that
  # reproduced on a fresh batch; exit 2 is a measurement that cannot be trusted (a failed control, a changed stream), and fails too.
  perf:
    name: perf (${{ matrix.profile }})
    needs: streams
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [chromium, chromium-cpu4x]
    env:
      CI: 'true'
      CONTROL_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.control_ref || 'HEAD^1' }}
    steps:
      # The control is another commit: the history it lives in comes with the checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node, the streams and the browser
        id: setup
        uses: ./.github/actions/setup
        with:
          streams: 'true'
          browser: chromium
      - name: Build the player
        run: npm run build:player
      - name: Performance gate (${{ matrix.profile }}, paired with its control)
        run: npm run gate:perf -- --paired --control-ref "$CONTROL_REF" --profile ${{ matrix.profile }}
      # Both reports of the profile, the control's summary included. Not `reports-*`: the flake jobs download that pattern.
      - name: Upload the performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports-${{ matrix.profile }}
          path: reports/perf
          retention-days: 14
          overwrite: true

  # The flake gate (docs/FLAKE.md, ADR-170): this build's runs are judged against the history of their environment, which lives on the
  # orphan branch `ci-data`, and the build fails when the policy of TEST_STRATEGY.md section 7.2 says so. It only READS the history:
  # `contents: read`, a checkout that keeps no credential, and a public repository, so the fetch of `ci-data` needs none. It runs when a
  # leg is red (a build that flaked is the one to judge) and not when the run was cancelled (ADR-171). Nothing can skip it: when no leg
  # ran (the streams job failed, so the legs were skipped) it has no run file to judge and fails, which makes it, as a required check,
  # the one that notices a merge gate that did not run.
  # A history is per environment and the gate refuses to mix them: the four Linux legs are one environment, macOS is another.
  flake:
    name: flake
    needs: merge-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The git store needs an identity even to read; this job never commits: nothing here pushes.
      FLAKE_IDENTITY: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the run files of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports/flake
      - name: Judge the Linux legs (gha-linux-x64)
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY"
          --runs reports/flake/reports-chromium --runs reports/flake/reports-firefox
          --runs reports/flake/reports-chromium-cpu4x --runs reports/flake/reports-webkit-linux
          --json reports/flake/gate-linux.json
      - name: Judge the macOS leg (gha-macos-arm64)
        if: ${{ !cancelled() }}
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY"
          --runs reports/flake/reports-webkit-macos --json reports/flake/gate-macos.json

  # Records the build in the history (ADR-170, ADR-172). The only job of the workflow with a write token, and it runs for a push to
  # main only: the code it runs is code that was merged, never a pull request's. The store pushes to `ci-data` with the token that
  # `actions/checkout` leaves configured, creates the branch (an orphan) when it is not there, never forces, and makes a lost race
  # again on the new tip. The gate judges before it records, and exits 1 on a verdict: that is the `flake` job's to report, so
  # this job answers whether the build is in the history (the file the gate writes says so) and not what the verdict was.
  flake-record:
    name: flake-record
    needs: merge-gate
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FLAKE_IDENTITY: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the run files of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: reports/flake
      - name: Record the Linux legs (gha-linux-x64)
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY" --record --push
          --runs reports/flake/reports-chromium --runs reports/flake/reports-firefox
          --runs reports/flake/reports-chromium-cpu4x --runs reports/flake/reports-webkit-linux
          --json reports/flake/gate-linux.json || [ "$?" -eq 1 ]
      - name: Record the macOS leg (gha-macos-arm64)
        if: ${{ !cancelled() }}
        run: >-
          npm run gate:flake -- --store git --git-identity "$FLAKE_IDENTITY" --record --push
          --runs reports/flake/reports-webkit-macos --json reports/flake/gate-macos.json || [ "$?" -eq 1 ]
      - name: Check that both environments are in the history
        if: ${{ !cancelled() }}
        run: jq -e -s 'all(.[]; .recorded != null)' reports/flake/gate-linux.json reports/flake/gate-macos.json

  # Failure triage (docs/TRIAGE.md, ADR-160 to ADR-169): when the merge gate or the flake gate is red, it groups the failures of every
  # leg by cause and says what to look at first. It explains a red build and never decides one: it is not a required check, it exits 0
  # whatever it finds (a bad command line is the only exit 2), and it is skipped on a green build, where there is nothing to explain.
  # It reads the Playwright reports of the legs from the artifacts, so the same cause in three engines is one cluster.
  triage:
    name: triage
    needs: [merge-gate, flake]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and the dependencies
        uses: ./.github/actions/setup
      - name: Download the reports of the legs
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: artifacts
      - name: Triage the failures
        run: npm run gate:triage -- --from artifacts --out reports/triage
      - name: Upload the triage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage
          path: reports/triage
          retention-days: 14
          overwrite: true
