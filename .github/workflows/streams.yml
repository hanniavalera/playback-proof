name: streams

# The lab's streams, generated at most once per cache key and shared with every browser job of the run as the `streams`
# artifact. Called by ci.yml (the merge gate) and nightly.yml, so that both use the same cache key and the same bytes.
# The browser jobs never run ffmpeg: macOS installs none (ADR-112), and Playwright's Linux image ships none.
# Decisions: docs/decisions/ci.md (ADR-112); the cache layout: docs/decisions/media.md (ADR-047).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  streams:
    name: streams
    runs-on: ubuntu-24.04
    # A cache hit takes about a minute; a miss adds the ffmpeg install and the generation (about 2 minutes on 4 vCPU). The rest is margin.
    timeout-minutes: 15
    env:
      # The major version of the ffmpeg that Ubuntu 24.04 ships. The bytes of a stream are reproducible for one ffmpeg build only
      # (ADR-045), so the version is part of the cache key. The key has to be known before ffmpeg is installed (a hit installs
      # nothing), so it is declared here and checked against `ffmpeg -version` on a miss: a cache entry is only ever saved
      # under the major that generated it.
      FFMPEG_MAJOR: '6'
    steps:
      - uses: actions/checkout@v7

      - name: Restore the stream cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/streams
          key: streams-v1-${{ runner.os }}-${{ runner.arch }}-ffmpeg${{ env.FFMPEG_MAJOR }}-${{ hashFiles('src/server/media/**', 'tools/generate-streams.ts') }}

      - name: Set up Node, the dependencies and ffmpeg (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'

      - name: Check the ffmpeg major version (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          first_line="$(ffmpeg -version | sed -n 1p)"
          echo "$first_line"
          case "$first_line" in
            "ffmpeg version ${FFMPEG_MAJOR}."*) ;;
            *)
              echo "::error::The streams would be generated by '$first_line' but the cache key says ffmpeg ${FFMPEG_MAJOR}. Update FFMPEG_MAJOR in .github/workflows/streams.yml."
              exit 1
              ;;
          esac

      - name: Generate the streams (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run generate:streams -- --verify

      - name: Save the stream cache (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/streams
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: List the streams
        env:
          SOURCE: ${{ steps.cache.outputs.cache-hit == 'true' && 'restored from the cache' || 'generated in this run' }}
        run: |
          {
            echo "### Streams ($SOURCE)"
            echo
            echo "| stream | content hash | ffmpeg |"
            echo "| --- | --- | --- |"
            jq -r '"| \(.index.info.id) | `\(.index.info.contentHash[0:12])` | \(.ffmpegVersion) |"' .cache/streams/*/*/stream.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Hidden directories are skipped by default, and `.cache` is one. Already-compressed media gains nothing from zip.
      - name: Publish the streams to the jobs of this run
        uses: actions/upload-artifact@v7
        with:
          name: streams
          path: .cache/streams
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true
