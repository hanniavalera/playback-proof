name: setup
description: Node, the locked dependencies and, when asked, ffmpeg. The checkout is a separate step, because a local action can only be used after it.

inputs:
  ffmpeg:
    description: >-
      'true' installs ffmpeg from apt (Ubuntu only). Stream generation and the media unit tests need it; the browser jobs do not,
      because they play the streams of the `streams` job. macOS never installs it: see ADR-112.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The version comes from .nvmrc, the same file a developer's version manager reads.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - if: inputs.ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
    - shell: bash
      run: npm ci --no-audit --no-fund
