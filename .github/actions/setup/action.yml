name: setup
description: Node, the locked dependencies and, when asked, ffmpeg, the shared streams and one Playwright browser. The checkout is a separate step, because a local action can only be used after it.

inputs:
  ffmpeg:
    description: >-
      'true' installs ffmpeg from apt (Ubuntu only). Stream generation and the media unit tests need it; the browser jobs do not,
      because they play the streams of the `streams` job. macOS never installs it: see ADR-112.
    required: false
    default: 'false'
  streams:
    description: >-
      'true' downloads the `streams` artifact of this run (published by .github/workflows/streams.yml) into .cache/streams, where the
      service looks for it.
    required: false
    default: 'false'
  browser:
    description: >-
      chromium, firefox or webkit: the one Playwright browser to install, cached by the Playwright version. On Linux its system
      packages are installed too (--with-deps). Empty installs none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The version comes from .nvmrc, the same file a developer's version manager reads.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install ffmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
    - name: Install the dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Download the streams
      if: inputs.streams == 'true'
      uses: actions/download-artifact@v8
      with:
        name: streams
        path: .cache/streams
    # These lines are in the log of every job that downloads the artifact: equal hashes show that the engines played the same bytes.
    - name: List the streams
      if: inputs.streams == 'true'
      shell: bash
      run: jq -r '"\(.index.info.id)  \(.index.info.contentHash[0:12])  ffmpeg \(.ffmpegVersion)"' .cache/streams/*/*/stream.json

    - name: Find the Playwright version
      if: inputs.browser != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore the Playwright browser
      if: inputs.browser != ''
      uses: actions/cache@v6
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}
    - name: Install the Playwright browser
      if: inputs.browser != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      # Two things went wrong on the hosted runners. A package download from the mirror stalled for the whole 15 minutes of the job
      # timeout. And the first answer to that, a watchdog that killed the install after five minutes, was worse: the apt-get it had
      # started (as root, through sudo) was still downloading from a slow mirror, outlived the kill, and held the dpkg lock, so the next
      # two attempts failed at once. Nothing here kills a process now. Apt is told to give up on a connection that stalls for 30 s and
      # to retry it, and to wait for the dpkg lock; the install itself gets three attempts for a mirror that answered with an error.
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "300";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-resilience > /dev/null
        fi
        for attempt in 1 2 3; do
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps "$BROWSER" && exit 0
          else
            npx playwright install "$BROWSER" && exit 0
          fi
          echo "::warning::the Playwright install of $BROWSER failed (attempt $attempt of 3)"
          sleep 10
        done
        exit 1
