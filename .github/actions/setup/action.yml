name: setup
description: Node, the locked dependencies and, when asked, ffmpeg, the shared streams and one Playwright browser. The checkout is a separate step, because a local action can only be used after it.

inputs:
  ffmpeg:
    description: >-
      'true' installs ffmpeg from apt (Ubuntu only). Stream generation and the media unit tests need it; the browser jobs do not,
      because they play the streams of the `streams` job. macOS never installs it: see ADR-112.
    required: false
    default: 'false'
  streams:
    description: >-
      'true' downloads the `streams` artifact of this run (published by .github/workflows/streams.yml) into .cache/streams, where the
      service looks for it.
    required: false
    default: 'false'
  browser:
    description: >-
      chromium, firefox or webkit: the one Playwright browser to install, cached by the Playwright version. On Linux its system
      packages are installed too (--with-deps). Empty installs none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The version comes from .nvmrc, the same file a developer's version manager reads.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install ffmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
    - name: Install the dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Download the streams
      if: inputs.streams == 'true'
      uses: actions/download-artifact@v8
      with:
        name: streams
        path: .cache/streams
    # These lines are in the log of every job that downloads the artifact: equal hashes show that the engines played the same bytes.
    - name: List the streams
      if: inputs.streams == 'true'
      shell: bash
      run: jq -r '"\(.index.info.id)  \(.index.info.contentHash[0:12])  ffmpeg \(.ffmpegVersion)"' .cache/streams/*/*/stream.json

    - name: Find the Playwright version
      if: inputs.browser != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore the Playwright browser
      if: inputs.browser != ''
      uses: actions/cache@v6
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}
    - name: Install the Playwright browser
      if: inputs.browser != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      # A browser download that stalls holds the job until its timeout (one did, for the whole 15 minutes, on a Firefox leg): every
      # attempt gets five minutes, in a process group of its own so that the watchdog stops the download and what it started, and
      # there are three attempts. A failure that is not a stall (a package that does not exist) fails three times and says so.
      run: |
        install() {
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps "$BROWSER"
          else
            npx playwright install "$BROWSER"
          fi
        }
        set -m
        for attempt in 1 2 3; do
          install &
          pid=$!
          ( sleep 300; kill -TERM -- "-$pid" 2>/dev/null ) &
          watchdog=$!
          if wait "$pid"; then
            kill -TERM -- "-$watchdog" 2>/dev/null || true
            exit 0
          fi
          kill -TERM -- "-$watchdog" 2>/dev/null || true
          echo "::warning::the Playwright install of $BROWSER failed or did not finish in 5 minutes (attempt $attempt of 3)"
        done
        exit 1
